name: xattr-retry shim

# Builds the xattr-retry LD_PRELOAD shim from files/bin/xattr-retry.c
# and publishes it as a GitHub Release asset, so no compiled binary
# is ever committed to the repo. Trigger by pushing a tag like
# shim-v1. The runner is ubuntu-24.04 to match the Muse VMs
# (x86_64, glibc 2.39).

on:
  push:
    tags:
      - 'shim-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test
        run: |
          gcc -shared -fPIC -O2 -o xattr-retry.so files/bin/xattr-retry.c -ldl
          file xattr-retry.so
          LD_PRELOAD="$PWD/xattr-retry.so" /bin/true
          sha256sum xattr-retry.so > xattr-retry.so.sha256
          cat xattr-retry.so.sha256

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" xattr-retry.so xattr-retry.so.sha256 --clobber
          else
            gh release create "$tag" xattr-retry.so xattr-retry.so.sha256 \
              --title "xattr-retry shim $tag" \
              --notes "Prebuilt xattr-retry.so (x86_64, Ubuntu 24.04 glibc), built by GitHub Actions from files/bin/xattr-retry.c at this tag. Verify the download against xattr-retry.so.sha256 before use."
          fi
